<!doctype html>
<!--
  Source for social-preview.png, the repository's social card.

  GitHub has no API for the social preview, so the PNG is uploaded by hand at
  Settings -> General -> Social preview. Edit this file, re-render, re-upload.

  Both paths must be absolute and the input needs a file:// URL — headless
  Chrome does not resolve either against the shell's working directory:

    REPO=/absolute/path/to/git-relay
    chrome --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1280,640 \
      --screenshot="$REPO/.github/social-preview.png" \
      "file://$REPO/.github/social-preview.html"

  1280x640 is GitHub's recommended size; the limit is 1 MB.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0B0E14;
    font-family: "Segoe UI", -apple-system, system-ui, sans-serif;
    color: #E6EAF2;
    position: relative;
  }

  /* Warm glow behind the wordmark, cool one at the laptop end — gives the
     card depth without any imagery, and hints at the direction of travel. */
  .glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow-a { width: 620px; height: 620px; left: -180px; top: -260px;
            background: rgba(240, 80, 51, 0.20); }
  .glow-b { width: 560px; height: 560px; right: -200px; bottom: -280px;
            background: rgba(64, 120, 255, 0.16); }

  .rule { position: absolute; top: 0; left: 0; right: 0; height: 5px;
          background: linear-gradient(90deg, #F05033 0%, #F0A868 45%, #4078FF 100%); }

  .frame { position: relative; height: 100%; padding: 74px 80px 66px;
           display: flex; flex-direction: column; justify-content: space-between; }

  .kicker { font-size: 19px; letter-spacing: .22em; text-transform: uppercase;
            color: #F0A868; font-weight: 600; margin-bottom: 20px; }
  h1 { font-size: 108px; line-height: .96; font-weight: 700; letter-spacing: -.035em; }
  .tag { font-size: 32px; line-height: 1.38; color: #99A3B4; margin-top: 24px;
         max-width: 1010px; font-weight: 400; }
  .tag b { color: #E6EAF2; font-weight: 600; }

  /* The three-stage flow is the whole product in one line, so it gets its own
     band rather than being decoration alongside the title. */
  .flow { display: flex; align-items: center; gap: 20px; }
  .node { display: flex; align-items: center; gap: 15px;
          background: #151A24; border: 1px solid #252C3A;
          border-radius: 15px; padding: 20px 26px; }
  .node.mid { border-color: #3A3020; background: #191710; }
  .node .lbl { font-size: 25px; font-weight: 600; letter-spacing: -.01em; }
  .node .sub { font-size: 17px; color: #7E8899; margin-top: 4px; }
  .arrow { flex: 1; height: 2px; position: relative;
           background: linear-gradient(90deg, #2A3242, #4A5568); }
  .arrow::after { content: ""; position: absolute; right: -1px; top: -5px;
                  border-left: 11px solid #4A5568;
                  border-top: 6px solid transparent;
                  border-bottom: 6px solid transparent; }
  .arrow span { position: absolute; top: -30px; width: 100%; text-align: center;
                font-size: 15px; color: #6B7484; letter-spacing: .08em;
                text-transform: uppercase; font-weight: 600; }

  .foot { display: flex; align-items: baseline; justify-content: space-between; }
  .repo { font-family: Consolas, "Cascadia Mono", monospace;
          font-size: 21px; color: #6B7484; }
  .repo b { color: #B8C0CE; font-weight: 400; }
  .stack { font-size: 18px; color: #5C6474; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="rule"></div>

  <div class="frame">
    <div>
      <div class="kicker">Git from your phone</div>
      <h1>Git&nbsp;Relay</h1>
      <div class="tag">
        Status, diffs, commit, push, branches — against the repos on your
        laptop, <b>without exposing it to the internet</b>.
      </div>
    </div>

    <div class="flow">
      <div class="node">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
             stroke="#F0A868" stroke-width="1.8" stroke-linecap="round">
          <rect x="6" y="2" width="12" height="20" rx="2.5"/>
          <line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/>
        </svg>
        <div>
          <div class="lbl">Phone</div>
          <div class="sub">React PWA</div>
        </div>
      </div>

      <div class="arrow"><span>outbound</span></div>

      <div class="node mid">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
             stroke="#F05033" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M6.5 18.5a4.2 4.2 0 0 1-.4-8.4 5.6 5.6 0 0 1 10.8-1.4 3.9 3.9 0 0 1 .6 7.7z"/>
        </svg>
        <div>
          <div class="lbl">Relay</div>
          <div class="sub">Supabase Realtime</div>
        </div>
      </div>

      <div class="arrow"><span>outbound</span></div>

      <div class="node">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"
             stroke="#4078FF" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="12" rx="1.8"/>
          <line x1="1.5" y1="20" x2="22.5" y2="20"/>
        </svg>
        <div>
          <div class="lbl">Laptop</div>
          <div class="sub">git runs here</div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="repo">github.com/<b>EduardPlesa/git-relay</b></div>
      <div class="stack">Electron&nbsp; ·&nbsp; React&nbsp; ·&nbsp; Supabase&nbsp; ·&nbsp; MIT</div>
    </div>
  </div>
</body>
</html>
